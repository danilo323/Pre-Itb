ServerName localhost

# El puerto 80 lo reescribe docker/entrypoint.sh con el valor de $PORT (Railway).
<VirtualHost *:80>
    DocumentRoot /var/www/html

    <Directory /var/www/html>
        # -Indexes: no listar carpetas. +FollowSymLinks: lo exige mod_rewrite en
        # .htaccess y ademas data/, img/, docs/ y audio/ son symlinks al volume.
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Cinturon y tirantes: data/ ya trae su .htaccess con "Require all denied",
    # pero si se perdiera dentro del volume esta regla sigue bloqueando los JSON.
    <Location /data>
        Require all denied
    </Location>

    # Sin ejecucion de PHP en carpetas de subidas (refuerza img/.htaccess).
    <LocationMatch "^/(img|docs|audio|uploads)/.*\.(php|phtml|php[0-9]|phps|phar|inc)$">
        Require all denied
    </LocationMatch>

    ErrorLog /dev/stderr
    CustomLog /dev/stdout combined
</VirtualHost>
