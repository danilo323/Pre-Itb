ServerName localhost

# El puerto 80 lo reescribe docker/entrypoint.sh con el valor de $PORT (Railway).
<VirtualHost *:80>
    DocumentRoot /var/www/html

    <Directory /var/www/html>
        # -Indexes: no listar carpetas. +FollowSymLinks: lo exige mod_rewrite en
        # .htaccess y ademas data/, img/, docs/ y audio/ son symlinks al volume.
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Cinturon y tirantes: data/ ya trae su .htaccess con "Require all denied",
    # pero si se perdiera dentro del volume esta regla sigue bloqueando los JSON.
    <Location /data>
        Require all denied
    </Location>

    # Sin ejecucion de PHP en carpetas de subidas (refuerza img/.htaccess).
    <LocationMatch "^/(img|docs|audio|uploads)/.*\.(php|phtml|php[0-9]|phps|phar|inc)$">
        Require all denied
    </LocationMatch>

    # Detras del proxy de Railway la peticion llega por HTTP al puerto interno
    # (8080) pero el navegador usa https://dominio (443). Sin esto, cualquier
    # redireccion que construya Apache (p. ej. /admin -> /admin/) apunta a
    # http://dominio:8080/... y el navegador no puede conectar.
    #  - HTTPS=on: PHP ve $_SERVER['HTTPS'] como si fuera TLS directo.
    #  - La regla de abajo hace la redireccion "directorio -> directorio/"
    #    antes que mod_dir, con https y sin puerto, cuando venimos del proxy.
    SetEnvIf X-Forwarded-Proto "^https$" HTTPS=on
    RewriteEngine On
    RewriteCond %{HTTP:X-Forwarded-Proto} =https
    RewriteCond %{DOCUMENT_ROOT}%{REQUEST_URI} -d
    RewriteCond %{REQUEST_URI} !/$
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI}/ [R=301,L]

    ErrorLog /dev/stderr
    CustomLog /dev/stdout combined
</VirtualHost>
