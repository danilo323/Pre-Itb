; Ajustes del proyecto ITB sobre php.ini-production.
; Se instala como conf.d/zz-itb.ini (se carga al final, gana sobre el resto).

; El panel valida subidas de hasta 32 MB (admin/config.php max_upload_mb).
; post_max_size debe ser mayor que upload_max_filesize o $_POST llega vacio
; y el token CSRF falla con un 403 confuso.
upload_max_filesize = 32M
post_max_size = 40M
memory_limit = 256M
max_execution_time = 60

; Nunca mostrar errores en la pagina publica; van al log del contenedor.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr
expose_php = Off

session.cookie_httponly = 1
session.use_strict_mode = 1
session.gc_maxlifetime = 3600

date.timezone = America/Guayaquil

default_charset = "UTF-8"
